# Intégration continue du backend École 221 (carte APP-CI-01, Agent 10 — Ibrahima Guèye).
# Déclenchée sur pull request et sur push vers main. Aucun service ni secret de production :
# les tests n'utilisent que des valeurs jetables. Tout contrôle en échec bloque la livraison.
name: backend-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests et construction
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Secret de test jetable (≥ 32 caractères) : jamais la valeur de production
      JWT_SECRET: ci-only-jwt-secret-${{ github.run_id }}-${{ github.run_attempt }}-0123456789
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Tests unitaires et d'intégration
        run: mvn -B -ntp verify   # (le wrapper ./mvnw du dépôt est incomplet : dossier .mvn absent)

      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-${{ github.sha }}
          path: target/surefire-reports/
          retention-days: 14

      - name: Artefact versionné (jar)
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: target/*.jar
          retention-days: 14

  secrets:
    name: Recherche de secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plage de commits à analyser (nouveaux commits uniquement)
        id: plage
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "opts=origin/${{ github.base_ref }}..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "opts=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      # L'historique ancien contient des secrets connus (carte APP-TL-07, purge à décider) :
      # on bloque toute NOUVELLE fuite sans rendre la CI rouge en permanence.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --no-banner --redact --log-opts="${{ steps.plage.outputs.opts }}"
