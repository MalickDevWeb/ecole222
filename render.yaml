services:
  - type: web
    name: ecole-221-backend
    env: docker
    branch: main
    plan: starter
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: ecole-db
          property: DATABASE_URL
      - key: DATABASE_USERNAME
        fromDatabase:
          name: ecole-db
          property: USERNAME
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: ecole-db
          property: PASSWORD
      - key: REDIS_URL
        fromService:
          name: ecole-redis
          property: REDIS_URL
    secretEnvVars:
      - key: JWT_SECRET
      - key: CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET

  - type: redis
    name: ecole-redis
    plan: starter

databases:
  - name: ecole-db
    plan: starter
    engine: postgresql
    version: "15"
    databaseName: ecole221
